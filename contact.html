<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | KAI Destination Wedding Planners</title>
    <meta name="description" content="Get in touch with KAI for your destination wedding planning.">
    <meta name="robots" content="index, follow">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --brand-gold: #a19273; --warm-beige: #F7F5F2; --text-dark: #1a1a1a; --text-gray: #666666; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--warm-beige); color: var(--text-dark); }
        .font-serif { font-family: 'Playfair Display', serif; }
        a { color: var(--brand-gold); text-decoration: none; }
        a:hover { color: var(--text-dark); }
        header { position: fixed; top: 0; left: 0; width: 100%; height: 80px; background: rgba(80, 80, 80, 0.4); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-between; padding: 0 60px; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        main { padding-top: 120px; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 40px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 48px; margin: 60px 0 20px; font-weight: 400; }
        footer { background: var(--text-dark); color: white; padding: 40px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 24px; font-weight: 700; color: white; letter-spacing: 2px;"><a href="index.html" style="color: white; text-decoration: none;">KAI</a></div>
    <nav style="display: flex; gap: 40px;">
        <a href="index.html" style="color: white; text-decoration: none; font-size: 13px; font-weight: 400;">Home</a>
        <a href="about.html" style="color: white; text-decoration: none; font-size: 13px; font-weight: 400;">About</a>
        <a href="services.html" style="color: white; text-decoration: none; font-size: 13px; font-weight: 400;">Services</a>
        <a href="destinations.html" style="color: white; text-decoration: none; font-size: 13px; font-weight: 400;">Destinations</a>
        <a href="gallery.html" style="color: white; text-decoration: none; font-size: 13px; font-weight: 400;">Gallery</a>
        <a href="contact.html" style="color: white; text-decoration: none; font-size: 13px; font-weight: 400;">Contact Us</a>
        <a href="home2.html" style="color: white; text-decoration: none; font-size: 13px; font-weight: 400;">Home 2</a>
    </nav>
    <a href="https://calendly.com/htnoam/30min" target="_blank" style="color: white; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-decoration: none;">DISCOVERY CALL</a>
</header>

<main>
    <div class="container" style="padding: 60px 40px;">
        <h1>Get In Touch</h1>
        <p style="font-size: 16px; color: var(--text-gray); line-height: 1.8; margin-bottom: 60px;">
            Let's discuss your destination wedding vision. Fill out the form below and we'll get back to you within 24 hours.
        </p>

        <form style="background: white; padding: 40px; border-radius: 8px; max-width: 600px;">
            <div style="margin-bottom: 20px;">
                <input type="text" name="name" placeholder="Your Name" required style="width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
            </div>
            <div style="margin-bottom: 20px;">
                <input type="email" name="email" placeholder="Your Email" required style="width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
            </div>
            <div style="margin-bottom: 20px;">
                <input type="tel" name="phone" placeholder="Your Phone" required style="width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
            </div>
            <div style="margin-bottom: 20px;">
                <input type="number" name="guests" placeholder="Number of Guests" min="1" style="width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
            </div>
            <div style="margin-bottom: 20px;">
                <input type="text" name="destination" placeholder="Preferred Destination" style="width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
            </div>
            <div style="margin-bottom: 20px;">
                <textarea name="message" placeholder="Tell us about your vision..." rows="6" style="width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; resize: none;"></textarea>
            </div>
            <button type="submit" style="background: var(--brand-gold); color: white; padding: 14px 40px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; width: 100%;">Send Message</button>
        </form>
    </div>
</main>

<footer>
    <p>&copy; 2024 KAI Destination Planners. All rights reserved.</p>
    <p style="margin-top: 15px;"><a href="https://instagram.com" target="_blank" style="color: var(--brand-gold); margin: 0 15px;">Instagram</a> • <a href="mailto:info@kai.com" style="color: var(--brand-gold); margin: 0 15px;">Email</a></p>
</footer>

</body>
</html>
